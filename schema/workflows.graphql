"""
A single log line streamed from a pod
"""
type LogEntry {
	"""
	The log line content
	"""
	content: String!
	"""
	The name of the pod producing the log
	"""
	podName: String!
}

"""
The root mutation of the service
"""
type Mutation {
	"""
	submit specific workflow template
	"""
	submitWorkflowTemplate(name: String!, visit: VisitInput!, parameters: JSON!): Workflow!
	"""
	Submit a manifest (YAML) as a one-off Workflow within a visit's namespace.
	
	The input is typically a `WorkflowTemplate` (the manifest developers author and
	store in their repository). It is submitted via the Argo Server API so the graph
	remains the single source of truth for submissions. To match the behaviour of the
	workflows CLI, the manifest is coerced into a one-off Workflow: `kind` is set to
	`Workflow`, and a fixed `metadata.name` is rewritten to a `metadata.generateName`
	(suffixed with `-`) so repeated submissions yield fresh, uniquely named Workflows.
	"""
	submitWorkflow(visit: VisitInput!, manifest: String!): Workflow!
	"""
	Create a Trigger from a template
	"""
	createTrigger(templateRef: String!, name: String, visit: VisitInput): Trigger
}

"""
Represents Relay Node types
"""
union NodeValue = Workflow

"""
Information about pagination in a connection
"""
type PageInfo @shareable {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

"""
The root query of the service
"""
type Query {
	node(id: ID!): NodeValue
	"""
	Get a single [`Workflow`] by proposal, visit, and name.
	
	In case of two workflows with the same name, returns the most recent.
	"""
	workflow(visit: VisitInput!, name: String!): Workflow @deprecated(reason: "Use workflowById instead")
	"""
	Get a single [`Workflow`] by unique ID.
	"""
	workflowById(id: ID!): Workflow
	"""
	Find all workflows available for a given visit
	"""
	workflows(visit: VisitInput!, cursor: String, limit: Int, filter: WorkflowFilter): WorkflowConnection!
	"""
	Retrieves a single cluster workflow template by name
	"""
	workflowTemplate(name: String!): WorkflowTemplate!
	"""
	Retrieves all cluster workflow templates with respective pagination data
	"""
	workflowTemplates(cursor: String, limit: Int, filter: WorkflowTemplatesFilter): WorkflowTemplateConnection!
	"""
	Get a specific Trigger by name and visit
	"""
	trigger(name: String!, visit: String): Trigger
	"""
	Get multiple Triggers across namespaces
	"""
	triggers(cursor: String, limit: Int): TriggerConnection!
}

